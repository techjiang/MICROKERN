[package]
name = "microkern-kernel"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "MICROKERN no_std microkernel core"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true

[lib]
name = "microkern_kernel"
path = "src/lib.rs"
test = true
bench = false

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
